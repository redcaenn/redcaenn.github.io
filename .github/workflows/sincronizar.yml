# Lee la hoja de Google una vez al día y, si hay cambios, abre una propuesta
# de cambios (pull request) para revisarla antes de publicar. Nada se publica solo.
name: Sincronizar desde Google Sheets

on:
  schedule:
    - cron: '0 14 * * *' # 7:00 en Tijuana / 8:00 en Ciudad de México
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write # para que Google reconozca a este repositorio sin llaves

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Google confía en este repositorio (rama main) y entrega un permiso de solo lectura
      # que vence en una hora. No hay ninguna llave guardada en ningún lado.
      - name: Pedir a Google acceso de solo lectura a la hoja
        id: google
        if: vars.GCP_WIF_PROVIDER != ''
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/spreadsheets.readonly,https://www.googleapis.com/auth/drive.readonly
          create_credentials_file: false

      - name: Descargar la hoja
        run: npm run sheets
        env:
          GOOGLE_SHEET_ID: ${{ vars.GOOGLE_SHEET_ID }}
          GOOGLE_ACCESS_TOKEN: ${{ steps.google.outputs.access_token }}

      - name: Traer las fotos de la carpeta de Drive
        run: |
          set -o pipefail
          node scripts/fotos-drive.mjs | tee fotos.txt
        env:
          GOOGLE_FOTOS_FOLDER_ID: ${{ vars.GOOGLE_FOTOS_FOLDER_ID }}
          GOOGLE_ACCESS_TOKEN: ${{ steps.google.outputs.access_token }}

      - name: Revisar los datos
        id: revisar
        run: |
          set +e
          npm run --silent validar > revision.txt 2>&1
          echo "estado=$?" >> "$GITHUB_OUTPUT"
          cat revision.txt

      - name: Abrir o actualizar la propuesta de cambios
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain -- datos fotos)" ]; then
            echo "La hoja y la carpeta de fotos no tienen cambios."
            exit 0
          fi
          rama=sincronizacion-sheets
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$rama"
          git add datos fotos
          git commit -m "Datos: cambios de la hoja y de las fotos de Drive ($(date +%F))"
          git push --force origin "$rama"

          if [ "${{ steps.revisar.outputs.estado }}" = "0" ]; then
            titulo="Cambios de la hoja de Google para revisar"
            estado="Los datos pasaron la revisión. Revisa los cambios en la pestaña **Files changed** y, si todo está bien, presiona **Merge** para publicarlos."
          else
            titulo="⚠️ Cambios de la hoja de Google con errores"
            estado="**Hay errores que impiden publicar.** Corrígelos en la hoja; mañana (o al volver a correr la sincronización) esta propuesta se actualiza sola."
          fi
          {
            echo "$estado"
            echo
            if [ -s fotos.txt ] && ! grep -q "sin cambios\|no configurado" fotos.txt; then
              echo "### Fotos"
              echo
              echo "Puedes verlas en la pestaña **Files changed** antes de aprobar."
              echo
              echo '```'
              cat fotos.txt
              echo '```'
              echo
            fi
            echo '```'
            cat revision.txt
            echo '```'
          } > cuerpo.md
          if gh pr view "$rama" --json state -q .state 2>/dev/null | grep -q OPEN; then
            gh pr edit "$rama" --title "$titulo" --body-file cuerpo.md
          else
            gh pr create --base main --head "$rama" --title "$titulo" --body-file cuerpo.md
          fi
